name: Release & Build Guides

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Re-release the current tag (use when a previous release partially failed)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-and-build:
    name: Release & Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-cjk \
            texlive-lang-greek \
            texlive-lang-spanish \
            fonts-noto-cjk \
            fonts-ipafont-gothic \
            fonts-ipafont-mincho

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Build all guides
        run: uv run guide-cli build-all --skip-font-check --continue-on-error

      - name: Semantic Release
        id: sr
        uses: urmzd/sr@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "outputs/*.pdf"
          force: ${{ inputs.force }}

      - name: Build summary
        if: always()
        run: |
          echo "## Release & Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.sr.outputs.released }}" = "true" ]; then
            echo "**Released:** v${{ steps.sr.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Released:** No release" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f outputs/build-manifest.json ]; then
            echo "### Build Manifest" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat outputs/build-manifest.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
